commerce_forumpay.commerce_payment_gateway.plugin.forumpay_redirect:
  type: commerce_payment_gateway_configuration
  mapping:
    api_url:
      type: string
      label: 'Environment'
    api_user:
      type: string
      label: 'API User'
    api_key:
      type: string
      label: 'API Secret'
    pos_id:
      type: string
      label: 'POS ID'
    success_order_state:
      type: string
      label: 'Success Order Status'
